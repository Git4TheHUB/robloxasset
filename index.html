<!DOCTYPE html>
<html>

<head>
    <title>RobloxAsset</title>
    <link rel="stylesheet" type="text/css" href="scripts/css/style.css">
    <link rel="stylesheet" type="text/css" href="scripts/css/fonts.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <meta name="description"
        content="Download Roblox shirts, models & other assets to use directly in your game, or for other use.">
    <meta name="robots" content="max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <link rel="canonical" href="https://robloxasset.tk/">
    <meta property="og:locale" content="en_US">
    <meta property="og:type" content="website">
    <meta property="og:title" content="RobloxAsset - Roblox Asset Downloader">
    <meta property="og:description"
        content="Download Roblox shirts, models & other assets to use directly in your game, or for other use.">
    <meta property="og:url" content="https://robloxasset.tk/">
    <meta property="og:site_name" content="RobloxAsset">
    <meta property="og:image" content="https://robloxasset.tk/images/robloxasset.jpg">
    <meta property="og:image:secure_url" content="https://robloxasset.tk/images/robloxasset.jpg">
    <meta property="og:image:width" content="560">
    <meta property="og:image:height" content="340">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description"
        content="Download Roblox shirts, models & other assets to use directly in your game, or for other use.">
    <meta name="twitter:title" content="RobloxAsset - Roblox Asset Downloader">
    <meta name="twitter:image" content="https://robloxasset.tk/images/robloxasset.jpg">
    
    <style>
        /* Quick override to make the input act like a text area for batch inputs */
        #assetURL {
            height: 80px;
            resize: vertical;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <div id="mainWrapper">
        <h1 class="mainHeader">Roblox<span>Asset</span></h1>
        <div id="formWrapper">
            <div id="form">
                <textarea autocomplete="off" id="assetURL" name="url" placeholder="Enter Roblox Asset URLs or IDs separated by commas..."></textarea>
                
                <select id="assetType" name="type">
                    <option value="placeholder">Select Asset Type (Auto-Detected)</option>
                    <option value="accessory">Accessory</option>
                    <option value="clothing">Clothing</option>
                    <option value="decal">Decal</option>
                    <option value="sound">Sound</option>
                    <option value="model">Model</option>
                    <option value="mesh">Mesh</option>
                    <option value="plugin">Plugin</option>
                </select>
                
                <p id="exampleText">Example: <span
                        class="example">4951534350, 6532975426</span></p>
                        
                <input id="submitAsset" type="submit" value="Download Asset(s)">
                <h2 id="loadMsg" style="display: none;">Downloading...</h2>
                <p id="errorMsg" style="display: none;">placeholder</p>
            </div>
        </div>
    </div>
    <p class="footer">Total Downloads: <span id="totalDownloads"></span> | Created by Nanoo</p>

    <script>
        const CORS_PROXY = "https://cors-anywhere.herokuapp.com/";

        // Roblox AssetTypeId -> file extension
        const ASSET_TYPE_EXT = {
            1:  ".png",   2:  ".rbxm",  3:  ".lua",   5:  ".rbxm",  8:  ".rbxm", 
            9:  ".png",   11: ".png",   12: ".png",   13: ".png",   17: ".rbxm",
            18: ".png",   19: ".rbxm",  21: ".png",   24: ".rbxm",  25: ".rbxm", 
            26: ".rbxm",  27: ".rbxm",  28: ".rbxm",  29: ".rbxm",  30: ".rbxm", 
            38: ".rbxm",  40: ".rbxm",  41: ".rbxm",  42: ".rbxm",  43: ".rbxm",  
            44: ".rbxm",  45: ".rbxm",  46: ".rbxm",  47: ".rbxm",  50: ".mp3",   
            51: ".rbxm",  61: ".ttf",   62: ".ttf",   63: ".mp4"
        };

        const IMAGE_TYPES = new Set([1, 9, 11, 12, 13, 18, 21]);

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("submitAsset").addEventListener("click", processOptions);
        });

        // ─── ID extraction ────────────────────────────────────────────────────────────
        function extractAssetId(url) {
            const match = url.match(/\/(\d{6,})/);
            return match ? match[1] : null;
        }

        // ─── Roblox JSON API calls ─────────────────────────────
        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status} — ${url}`);
            return res.json();
        }

        async function getAssetDetails(assetId) {
            const data = await fetchJSON(`https://economy.roblox.com/v2/assets/${assetId}/details`);
            return { name: data.Name, assetTypeId: data.AssetTypeId };
        }

        async function getAssetThumbnailUrl(assetId) {
            const data = await fetchJSON(`https://thumbnails.roblox.com/v1/assets?assetIds=${assetId}&size=420x420&format=Png&isCircular=false`);
            const entry = data?.data?.[0];
            if (!entry || entry.state !== "Completed") {
                throw new Error("Thumbnail not yet available — try again in a moment");
            }
            return entry.imageUrl;
        }

        // ─── Binary download (CORS proxy required for models/audio) ──────────────────
        async function fetchBlob(url) {
            const res = await fetch(CORS_PROXY + url);
            if (!res.ok) throw new Error(`HTTP ${res.status} downloading asset`);
            return res.blob();
        }

        // ─── Batch Processing & Zipping ────────────────────────
        async function processOptions() {
            const inputVal = document.getElementById("assetURL").value.trim();

            hideError();
            resetBorders();

            if (!inputVal) {
                markInvalid("assetURL");
                return showError("Asset URL or ID was not specified");
            }

            // Parse comma-separated string
            const rawInputs = inputVal.split(',').map(s => s.trim()).filter(Boolean);
            const assetIds = [];

            for (const raw of rawInputs) {
                if (/^\d+$/.test(raw)) {
                    assetIds.push(raw); 
                } else {
                    const extracted = extractAssetId(raw);
                    if (extracted) assetIds.push(extracted); 
                }
            }

            if (assetIds.length === 0) {
                markInvalid("assetURL");
                return showError("Could not find valid asset IDs in your input.");
            }

            // Initialize JSZip instance
            const zip = new JSZip();
            let filesAddedToZip = 0;

            for (let i = 0; i < assetIds.length; i++) {
                const assetId = assetIds[i];
                showLoadMsg(`Fetching Asset ${i + 1} of ${assetIds.length} (ID: ${assetId})...`);

                try {
                    const { name, assetTypeId } = await getAssetDetails(assetId);
                    const ext = ASSET_TYPE_EXT[assetTypeId] ?? ".bin";
                    const filename = sanitizeFilename(name) + ext;

                    changeLoadMsg(`Adding ${filename} to zip...`);

                    let downloadUrl;
                    let fileBlob;
                    
                    if (IMAGE_TYPES.has(assetTypeId)) {
                        // Image types fetch directly from Roblox Thumbnail API (No proxy needed)
                        downloadUrl = await getAssetThumbnailUrl(assetId);
                        const res = await fetch(downloadUrl);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        fileBlob = await res.blob();
                    } else {
                        // Other types route through the assetdelivery server (Proxy needed)
                        downloadUrl = `https://assetdelivery.roblox.com/v1/asset/?id=${assetId}`;
                        fileBlob = await fetchBlob(downloadUrl);
                    }

                    // Add the file blob to the ZIP
                    zip.file(filename, fileBlob);
                    filesAddedToZip++;
                    
                    await new Promise(r => setTimeout(r, 500)); // Short delay to prevent API rate limits
                } catch (err) {
                    console.error(err);
                    showError(`Skipped ID ${assetId}: ` + err.message);
                    await new Promise(r => setTimeout(r, 2000)); 
                    hideError();
                }
            }

            // Generate and download the final ZIP file
            if (filesAddedToZip > 0) {
                changeLoadMsg("Zipping your files... Please wait.");
                const zipBlob = await zip.generateAsync({ type: "blob" });
                triggerZipDownload(zipBlob, "RobloxAssets.zip");
                
                hideLoadMsg();
                showLoadMsg("All downloads zipped and finished!");
            } else {
                hideLoadMsg();
                showError("No valid assets could be downloaded.");
            }
            
            setTimeout(hideLoadMsg, 3000);
        }

        // ─── Zip Download trigger ─────────────────────────────────────────────────────
        function triggerZipDownload(blob, filename) {
            const anchor = document.createElement("a");
            anchor.href  = URL.createObjectURL(blob);
            anchor.setAttribute("download", filename);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(anchor.href);
        }

        // ─── Utilities & UI helpers ───────────────────────────────────────────────────
        function sanitizeFilename(name) {
            return (name ?? "unnamed").replace(/[/\\:*?"<>|]/g, "_").trim() || "unnamed";
        }

        function showError(message) {
            const el = document.getElementById("errorMsg");
            el.innerText = message;
            el.style.display = "block"; 
        }

        function hideError() {
            document.getElementById("errorMsg").style.display = "none";
        }

        function showLoadMsg(message) {
            const el = document.getElementById("loadMsg");
            el.innerText = message;
            el.style.display = "block";
            document.getElementById("submitAsset").style.display = "none";
        }

        function hideLoadMsg() {
            document.getElementById("loadMsg").style.display = "none";
            document.getElementById("submitAsset").style.display = "block";
        }

        function changeLoadMsg(message) {
            document.getElementById("loadMsg").innerText = message;
        }

        function markInvalid(id) {
            document.getElementById(id).style.borderColor = "#f74b52";
        }

        function resetBorders() {
            document.getElementById("assetURL").style.borderColor = "#ccc";
            const typeEl = document.getElementById("assetType");
            if (typeEl) typeEl.style.borderColor = "#ccc";
        }
    </script>
</body>

</html>
